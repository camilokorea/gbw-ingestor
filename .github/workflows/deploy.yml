name: Deploy .NET Workers to Linode

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ─────────────────────────────────────────────────────────────
  # BUILD — compile & publish all workers
  # ─────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    # ── eBird Ingestor ──────────────────────────────────────────
    - name: Publish eBird Ingestor
      run: dotnet publish src/Worker/eBird.Ingestor.Worker.csproj --configuration Release --no-build --output publish/ebird

    - name: Rename eBird appsettings template
      run: mv publish/ebird/appsettings.template.json publish/ebird/appsettings.json

    - name: Inject secrets into eBird appsettings
      env:
        DB_SERVER: ${{ secrets.DB_SERVER }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
      run: |
        sed -i "s#YOUR_DATABASE_SERVER#$DB_SERVER#g" publish/ebird/appsettings.json
        sed -i "s#YOUR_USER#$DB_USER#g"             publish/ebird/appsettings.json
        sed -i "s#YOUR_PASSWORD#$DB_PASSWORD#g"     publish/ebird/appsettings.json
        sed -i "s#YOUR_EBIRD_API_KEY#$EBIRD_API_KEY#g" publish/ebird/appsettings.json

    - name: Upload eBird artifact
      uses: actions/upload-artifact@v4
      with:
        name: ebird-app
        path: publish/ebird

    # ── Sound Ingestor ──────────────────────────────────────────
    - name: Publish Sound Ingestor
      run: dotnet publish src/Sound.Ingestor.Worker/Sound.Ingestor.Worker.csproj --configuration Release --no-build --output publish/sound

    - name: Inject secrets into Sound appsettings
      env:
        DB_SERVER: ${{ secrets.DB_SERVER }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        sed -i "s#YOUR_DATABASE_SERVER#$DB_SERVER#g" publish/sound/appsettings.json
        sed -i "s#YOUR_USER#$DB_USER#g"              publish/sound/appsettings.json
        sed -i "s#YOUR_PASSWORD#$DB_PASSWORD#g"      publish/sound/appsettings.json

    - name: Upload Sound artifact
      uses: actions/upload-artifact@v4
      with:
        name: sound-app
        path: publish/sound

    # ── Flickr Synch ────────────────────────────────────────────
    - name: Publish Flickr Synch
      run: dotnet publish src/Flickr.Synch.Worker/Flickr.Synch.Worker.csproj --configuration Release --no-build --output publish/flickr-synch

    - name: Inject secrets into Flickr Synch appsettings
      env:
        DB_SERVER: ${{ secrets.DB_SERVER }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
        FLICKR_API_SECRET: ${{ secrets.FLICKR_API_SECRET }}
      run: |
        sed -i "s#YOUR_DATABASE_SERVER#$DB_SERVER#g"       publish/flickr-synch/appsettings.json
        sed -i "s#YOUR_USER#$DB_USER#g"                    publish/flickr-synch/appsettings.json
        sed -i "s#YOUR_PASSWORD#$DB_PASSWORD#g"            publish/flickr-synch/appsettings.json
        sed -i "s#YOUR_FLICKR_API_KEY#$FLICKR_API_KEY#g"  publish/flickr-synch/appsettings.json
        sed -i "s#YOUR_FLICKR_API_SECRET#$FLICKR_API_SECRET#g" publish/flickr-synch/appsettings.json

    - name: Upload Flickr Synch artifact
      uses: actions/upload-artifact@v4
      with:
        name: flickr-synch-app
        path: publish/flickr-synch

    # ── Flickr Eraser ───────────────────────────────────────────
    - name: Publish Flickr Eraser
      run: dotnet publish src/Flickr.Eraser.Worker/Flickr.Eraser.Worker.csproj --configuration Release --no-build --output publish/flickr-eraser

    - name: Inject secrets into Flickr Eraser appsettings
      env:
        DB_SERVER: ${{ secrets.DB_SERVER }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        sed -i "s#YOUR_DATABASE_SERVER#$DB_SERVER#g" publish/flickr-eraser/appsettings.json
        sed -i "s#YOUR_USER#$DB_USER#g"              publish/flickr-eraser/appsettings.json
        sed -i "s#YOUR_PASSWORD#$DB_PASSWORD#g"      publish/flickr-eraser/appsettings.json

    - name: Upload Flickr Eraser artifact
      uses: actions/upload-artifact@v4
      with:
        name: flickr-eraser-app
        path: publish/flickr-eraser

    # ── Flickr Geo ──────────────────────────────────────────────
    - name: Publish Flickr Geo
      run: dotnet publish src/Flickr.Geo.Worker/Flickr.Geo.Worker.csproj --configuration Release --no-build --output publish/flickr-geo

    - name: Inject secrets into Flickr Geo appsettings
      env:
        DB_SERVER: ${{ secrets.DB_SERVER }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
        FLICKR_API_SECRET: ${{ secrets.FLICKR_API_SECRET }}
      run: |
        sed -i "s#YOUR_DATABASE_SERVER#$DB_SERVER#g"       publish/flickr-geo/appsettings.json
        sed -i "s#YOUR_USER#$DB_USER#g"                    publish/flickr-geo/appsettings.json
        sed -i "s#YOUR_PASSWORD#$DB_PASSWORD#g"            publish/flickr-geo/appsettings.json
        sed -i "s#YOUR_FLICKR_API_KEY#$FLICKR_API_KEY#g"  publish/flickr-geo/appsettings.json
        sed -i "s#YOUR_FLICKR_API_SECRET#$FLICKR_API_SECRET#g" publish/flickr-geo/appsettings.json

    - name: Upload Flickr Geo artifact
      uses: actions/upload-artifact@v4
      with:
        name: flickr-geo-app
        path: publish/flickr-geo

    # ── Flickr Matcher ──────────────────────────────────────────
    - name: Publish Flickr Matcher
      run: dotnet publish src/Flickr.Matcher.Worker/Flickr.Matcher.Worker.csproj --configuration Release --no-build --output publish/flickr-matcher

    - name: Inject secrets into Flickr Matcher appsettings
      env:
        DB_SERVER: ${{ secrets.DB_SERVER }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        sed -i "s#YOUR_DATABASE_SERVER#$DB_SERVER#g" publish/flickr-matcher/appsettings.json
        sed -i "s#YOUR_USER#$DB_USER#g"              publish/flickr-matcher/appsettings.json
        sed -i "s#YOUR_PASSWORD#$DB_PASSWORD#g"      publish/flickr-matcher/appsettings.json

    - name: Upload Flickr Matcher artifact
      uses: actions/upload-artifact@v4
      with:
        name: flickr-matcher-app
        path: publish/flickr-matcher

    # ── iNat Ingestor ───────────────────────────────────────────
    - name: Publish iNat Ingestor
      run: dotnet publish src/iNat.Ingestor.Worker/iNat.Ingestor.Worker.csproj --configuration Release --no-build --output publish/inat-ingestor

    - name: Inject secrets into iNat appsettings
      env:
        DB_SERVER: ${{ secrets.DB_SERVER }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        sed -i "s#YOUR_DATABASE_SERVER#$DB_SERVER#g" publish/inat-ingestor/appsettings.json
        sed -i "s#YOUR_USER#$DB_USER#g"              publish/inat-ingestor/appsettings.json
        sed -i "s#YOUR_PASSWORD#$DB_PASSWORD#g"      publish/inat-ingestor/appsettings.json

    - name: Upload iNat Ingestor artifact
      uses: actions/upload-artifact@v4
      with:
        name: inat-ingestor-app
        path: |
          publish/inat-ingestor
          deploy/systemd/inat-ingestor.*
    # ── iNat Photo ──────────────────────────────────────────────
    - name: Publish iNat Photo Worker
      run: dotnet publish src/INat.Photo.Worker/INat.Photo.Worker.csproj --configuration Release --no-build --output publish/inat-photo

    - name: Rename iNat Photo appsettings template
      run: mv publish/inat-photo/appsettings.template.json publish/inat-photo/appsettings.json

    - name: Inject secrets into iNat Photo appsettings
      env:
        DB_SERVER: ${{ secrets.DB_SERVER }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        sed -i "s#YOUR_DATABASE_SERVER#$DB_SERVER#g" publish/inat-photo/appsettings.json
        sed -i "s#YOUR_USER#$DB_USER#g"              publish/inat-photo/appsettings.json
        sed -i "s#YOUR_PASSWORD#$DB_PASSWORD#g"      publish/inat-photo/appsettings.json

    - name: Upload iNat Photo artifact
      uses: actions/upload-artifact@v4
      with:
        name: inat-photo-app
        path: publish/inat-photo

  # ─────────────────────────────────────────────────────────────
  # DEPLOY — eBird Ingestor
  # ─────────────────────────────────────────────────────────────
  deploy-ebird:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download eBird artifact
      uses: actions/download-artifact@v4
      with:
        name: ebird-app
        path: ./app

    - name: Copy to Linode
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        source: "app/."
        target: "/APPS/ebird-ingestor"

    - name: Set permissions
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        script: |
          DEPLOY_PATH="/APPS/ebird-ingestor/app"
          sudo chown -R root:root $DEPLOY_PATH
          sudo chmod -R 755 $DEPLOY_PATH
          sudo systemctl daemon-reload

  # ─────────────────────────────────────────────────────────────
  # DEPLOY — Sound Ingestor
  # ─────────────────────────────────────────────────────────────
  deploy-sound-ingestor:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download Sound artifact
      uses: actions/download-artifact@v4
      with:
        name: sound-app
        path: ./app

    - name: Copy to Linode
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        source: "app/."
        target: "/APPS/sound-ingestor"

    - name: Set permissions
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        script: |
          DEPLOY_PATH="/APPS/sound-ingestor/app"
          sudo chown -R root:root $DEPLOY_PATH
          sudo chmod -R 755 $DEPLOY_PATH
          sudo systemctl daemon-reload

  # ─────────────────────────────────────────────────────────────
  # DEPLOY — Flickr Synch
  # ─────────────────────────────────────────────────────────────
  deploy-flickr-synch:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download Flickr Synch artifact
      uses: actions/download-artifact@v4
      with:
        name: flickr-synch-app
        path: ./app

    - name: Copy to Linode
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        source: "app/."
        target: "/APPS/flickr-synch"

    - name: Set permissions
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        script: |
          DEPLOY_PATH="/APPS/flickr-synch/app"
          sudo chown -R root:root $DEPLOY_PATH
          sudo chmod -R 755 $DEPLOY_PATH
          sudo systemctl daemon-reload

  # ─────────────────────────────────────────────────────────────
  # DEPLOY — Flickr Eraser
  # ─────────────────────────────────────────────────────────────
  deploy-flickr-eraser:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download Flickr Eraser artifact
      uses: actions/download-artifact@v4
      with:
        name: flickr-eraser-app
        path: ./app

    - name: Copy to Linode
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        source: "app/."
        target: "/APPS/flickr-eraser"

    - name: Set permissions
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        script: |
          DEPLOY_PATH="/APPS/flickr-eraser/app"
          sudo chown -R root:root $DEPLOY_PATH
          sudo chmod -R 755 $DEPLOY_PATH
          sudo systemctl daemon-reload

  # ─────────────────────────────────────────────────────────────
  # DEPLOY — Flickr Geo
  # ─────────────────────────────────────────────────────────────
  deploy-flickr-geo:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download Flickr Geo artifact
      uses: actions/download-artifact@v4
      with:
        name: flickr-geo-app
        path: ./app

    - name: Copy to Linode
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        source: "app/."
        target: "/APPS/flickr-geo"

    - name: Set permissions
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        script: |
          DEPLOY_PATH="/APPS/flickr-geo/app"
          sudo chown -R root:root $DEPLOY_PATH
          sudo chmod -R 755 $DEPLOY_PATH
          sudo systemctl daemon-reload

  # ─────────────────────────────────────────────────────────────
  # DEPLOY — Flickr Matcher
  # ─────────────────────────────────────────────────────────────
  deploy-flickr-matcher:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download Flickr Matcher artifact
      uses: actions/download-artifact@v4
      with:
        name: flickr-matcher-app
        path: ./app

    - name: Copy to Linode
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        source: "app/."
        target: "/APPS/flickr-matcher"

    - name: Set permissions
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        script: |
          DEPLOY_PATH="/APPS/flickr-matcher/app"
          sudo chown -R root:root $DEPLOY_PATH
          sudo chmod -R 755 $DEPLOY_PATH
          sudo systemctl daemon-reload

  # ─────────────────────────────────────────────────────────────
  # DEPLOY — iNat Ingestor
  # ─────────────────────────────────────────────────────────────
  deploy-inat-ingestor:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download iNat Ingestor artifact
      uses: actions/download-artifact@v4
      with:
        name: inat-ingestor-app
        path: ./app

    - name: Copy to Linode
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        source: "app/."
        target: "/APPS/inat-ingestor"

    - name: Set permissions and reload systemd
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        script: |
          # 1. Update app permissions (re-map path to correct publish location)
          DEPLOY_PATH="/APPS/inat-ingestor/app"
          APP_SRC="/APPS/inat-ingestor/publish/inat-ingestor"
          
          sudo mkdir -p $DEPLOY_PATH
          sudo cp -r $APP_SRC/. $DEPLOY_PATH/
          
          sudo chown -R root:root $DEPLOY_PATH
          sudo chmod -R 755 $DEPLOY_PATH

          # 2. Deploy systemd files
          SYSTEMD_SRC="/APPS/inat-ingestor/deploy/systemd"
          sudo cp $SYSTEMD_SRC/inat-ingestor.service /etc/systemd/system/
          sudo cp $SYSTEMD_SRC/inat-ingestor.timer /etc/systemd/system/

          # 3. Reload and restart timer
          sudo systemctl daemon-reload
          sudo systemctl enable inat-ingestor.timer
          sudo systemctl restart inat-ingestor.timer

  # ─────────────────────────────────────────────────────────────
  # DEPLOY — iNat Photo Worker
  # ─────────────────────────────────────────────────────────────
  deploy-inat-photo:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download iNat Photo artifact
      uses: actions/download-artifact@v4
      with:
        name: inat-photo-app
        path: ./app

    - name: Copy app to Linode
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        source: "app/."
        target: "/APPS/inat-photo/app"
        strip_components: 1

    - name: Install systemd units and restart timer
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        script: |
          # 1. Permissions
          sudo chown -R root:root /APPS/inat-photo/app
          sudo chmod -R 755 /APPS/inat-photo/app

          # 2. Write systemd service file
          sudo tee /etc/systemd/system/inat-photo.service > /dev/null << 'EOF'
          [Unit]
          Description=GBW iNaturalist Photo Worker -- downloads bird photos from iNat observations.
          After=network.target

          [Service]
          Type=oneshot
          WorkingDirectory=/APPS/inat-photo/app
          ExecStart=/usr/bin/dotnet /APPS/inat-photo/app/INat.Photo.Worker.dll
          User=root
          Group=root

          [Install]
          WantedBy=multi-user.target
          EOF

          # 3. Write systemd timer file
          sudo tee /etc/systemd/system/inat-photo.timer > /dev/null << 'EOF'
          [Unit]
          Description=Timer for GBW iNaturalist Photo Worker
          After=network.target

          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=4h
          RandomizedDelaySec=5min

          [Install]
          WantedBy=timers.target
          EOF

          # 4. Reload and enable
          sudo systemctl daemon-reload
          sudo systemctl enable inat-photo.timer
          sudo systemctl restart inat-photo.timer
